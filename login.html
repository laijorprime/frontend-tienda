<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ReposteriaShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .auth-container h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .auth-container p {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .auth-container input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .auth-container input:focus {
            border-color: #c0392b;
            outline: none;
        }
        .auth-container .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-container .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.3);
        }
        .auth-container .link {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }
        .auth-container .link a {
            color: #c0392b;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-container .link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #e74c3c;
            text-align: center;
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            background: #fde8e4;
            border-radius: 8px;
        }
        .success-msg {
            color: #27ae60;
            text-align: center;
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f8e4;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-utensils"></i>
                <h1>DIRO-<span>Cocina Y Repostería</span></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="index.html#productos">Productos</a></li>
                    <li><a href="index.html#contacto">Contacto</a></li>
                    <li><a href="#" id="btn-logout" style="display:none;">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ========== FORMULARIO DE LOGIN ========== -->
    <div class="container">
        <div class="auth-container">
            <h2><i class="fas fa-user-circle"></i> Iniciar Sesión</h2>
            <p>Accede a tu cuenta para gestionar tus pedidos</p>
            
            <div id="error-msg" class="error-msg">❌ Credenciales incorrectas</div>
            <div id="success-msg" class="success-msg">✅ Inicio de sesión exitoso</div>

            <form id="form-login">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <div class="link">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer>
        <div class="container">
            <p>&copy; 2026 ReposteriaShop - Todos los derechos reservados</p>
        </div>
    </footer>

    <script>
        const API_URL = 'https://backend-tienda-production-8536.up.railway.app/api';
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        // Si ya está logueado, redirigir
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.exito) {
                    // Guardar token y datos del usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    
                    successMsg.textContent = '✅ ¡Bienvenido, ' + data.usuario.nombre + '!';
                    successMsg.style.display = 'block';
                    
                    // Redirigir después de 1.5 segundos
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    errorMsg.textContent = '❌ ' + data.mensaje;
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = '❌ Error de conexión con el servidor';
                errorMsg.style.display = 'block';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
