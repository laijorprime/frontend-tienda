<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - ReposteriaShop</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <!-- Mismo header que en index.html -->
        <div class="container">
            <div class="logo">
                <i class="fas fa-utensils"></i>
                <h1>Reposteria<span>Shop</span></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container" style="padding: 40px 0;">
        <h2 class="titulo-seccion">Contáctanos</h2>
        <div class="contacto-grid">
            <div class="contacto-info">
                <h3>📍 Visítanos</h3>
                <p><i class="fas fa-map-marker-alt"></i> Av. Principal 123, Lima</p>
                <p><i class="fas fa-phone"></i> +51 999 888 777</p>
                <p><i class="fas fa-clock"></i> Lun-Sáb: 9am - 8pm</p>
            </div>
            <form class="contacto-form">
                <input type="text" placeholder="Tu nombre" required>
                <input type="email" placeholder="Tu correo" required>
                <textarea placeholder="Mensaje" rows="4"></textarea>
                <button type="submit" class="btn-primary">Enviar</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 ReposteriaShop - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
